# Checks the dependency graph of ILSight.Core's browse tree: no arrow points back up, so a new back edge
# fails the build instead of waiting on review. The test reads the built Core assembly's metadata and IL;
# the graph and its rules are in ILSight.Tests/DependencyTests.cs.
name: dependencies

on:
  push:
    branches: [main]
    paths:
      - "ILSight.Core/**"
      - "ILSight.Tests/DependencyTests.cs"
      - ".github/workflows/dependencies.yml"
  pull_request:
    paths:
      - "ILSight.Core/**"
      - "ILSight.Tests/DependencyTests.cs"
      - ".github/workflows/dependencies.yml"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Dependency test
        run: dotnet test ILSight.Tests/ILSight.Tests.csproj --filter "FullyQualifiedName~ILSight.Tests.DependencyTests"
