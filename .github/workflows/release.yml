# Builds the NativeAOT app for every platform and packs each with Velopack. Run from the Actions tab
# with "release" ticked, it then publishes them all as one GitHub Release, which is the feed installed
# apps update from, tagged with the version it was built as.
#
# The version is the day's date in UTC and which release of that day it is: 2026.11.7-1, then
# 2026.11.7-2. Velopack wants three numbers in SemVer order, and a number alone after the dash sorts as
# a number, so -10 comes after -2. A version with no -N would sort above all of that day's, so there is
# never one. The tag is only made once every platform has built, so a failed run takes no number.
#
# Run without "release", or on a pull request that changes this file, it builds the same and leaves the
# packed files as a build artifact.
name: release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"

# Two releases at once would pick the same number, so they queue; other runs don't wait on anything.
concurrency:
  group: ${{ inputs.release && 'release' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      short: ${{ steps.pick.outputs.short }}
      bundle: ${{ steps.pick.outputs.bundle }}
    steps:
      - uses: actions/checkout@v6

      # macOS wants a bundle's versions as numbers alone: the date for people, and for the build a
      # number that grows with each release, the month and day run together then N, as 2026.1107.2.
      - name: Pick the version
        id: pick
        run: |
          read -r year month day < <(date -u '+%Y %-m %-d')
          date="$year.$month.$day"
          # The highest N already tagged today, matched as a literal prefix.
          last=0
          for tag in $(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||'); do
            n=${tag#"v$date-"}
            if [ "$n" != "$tag" ] && [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$last" ]; then
              last=$n
            fi
          done
          n=$(( last + 1 ))
          version="$date-$n"
          echo "Version: $version"
          {
            echo "version=$version"
            echo "short=$date"
            echo "bundle=$year.$(( month * 100 + day )).$n"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.rid }})
    # NativeAOT can't cross-compile between OSes, but it can between macOS architectures, so both Macs
    # build on the arm64 runner.
    # Linux builds on the oldest supported Ubuntu because the binary needs the glibc it was linked
    # against or newer: ubuntu-latest would drop every distro older than itself.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, exe: ILSight.exe, glfw: glfw3.dll, icon: ILSight/Assets/Icon/app.ico }
          - { rid: osx-arm64, os: macos-latest, exe: ILSight, glfw: glfw3, icon: packaging/AppIcon.icns, pack_args: --bundleId com.builtbyzee.ilsight }
          - { rid: osx-x64, os: macos-latest, exe: ILSight, glfw: glfw3, icon: packaging/AppIcon.icns, pack_args: --bundleId com.builtbyzee.ilsight }
          - { rid: linux-x64, os: ubuntu-22.04, exe: ILSight, glfw: libglfw.so.3, icon: ILSight/Assets/Icon/Linux/app_icon_512.png }
    needs: version
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PUBLISH_DIR: publish/${{ matrix.rid }}
      PACK_DIR: publish/${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      # The fonts and GLFW natives are LFS objects inside the submodules, which the option above may
      # leave as pointer files. A pointer still builds, so the app would only fail once it runs.
      - name: Pull LFS objects in submodules
        run: git submodule foreach --recursive git lfs pull

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install the NativeAOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The version picked above replaces the one MinVer would read from the tags, which local builds
      # still use.
      - name: Publish
        run: dotnet publish ILSight/ILSight.csproj -c Release -r ${{ matrix.rid }} -o "$PUBLISH_DIR" -p:MinVerVersionOverride="$VERSION"

      # What only fails at launch, so the build can't catch it.
      - name: Check the output
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f "$PUBLISH_DIR/${{ matrix.exe }}" ] || fail "${{ matrix.exe }} is missing"
          [ ! -f "$PUBLISH_DIR/ILSight.dll" ] || fail "ILSight.dll was published: this is not a NativeAOT build"
          glfw="$PUBLISH_DIR/${{ matrix.glfw }}"
          [ -f "$glfw" ] || fail "${{ matrix.glfw }} is missing"
          if head -c 40 "$glfw" | grep -aq "git-lfs"; then fail "${{ matrix.glfw }} is an LFS pointer"; fi

      - name: Remove debug files
        run: |
          find "$PUBLISH_DIR" -type f \( -name '*.pdb' -o -name '*.dbg' -o -name '*.xml' \) -delete
          rm -rf "$PUBLISH_DIR"/*.dSYM

      # The tool has to match the package the app is built with, so it reads the version from there.
      - name: Install vpk
        run: |
          version=$(sed -n 's/.*Include="Velopack" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)
          dotnet tool install vpk --version "$version" --tool-path .tools

      # actool needs Xcode 26 for the Icon Composer source. Assets.car is the icon macOS 26 draws, and
      # AppIcon.icns the same icon for older versions.
      - name: Compile the macOS icon
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          mkdir -p packaging
          xcrun actool ILSight/Assets/Icon/AppIcon.icon --compile packaging --platform macosx \
            --target-device mac --minimum-deployment-target 12.0 --app-icon AppIcon --include-all-app-icons \
            --output-partial-info-plist packaging/partial.plist
          test -f packaging/Assets.car && test -f packaging/AppIcon.icns

      # vpk builds a bundle from a folder with --icon alone, which can't carry Assets.car. Given a .app
      # it keeps what is there and adds its updater.
      - name: Assemble the macOS bundle
        if: runner.os == 'macOS'
        run: |
          app=bundle/ILSight.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R "$PUBLISH_DIR/." "$app/Contents/MacOS/"
          cp packaging/Assets.car packaging/AppIcon.icns "$app/Contents/Resources/"
          sed -e "s/__VERSION__/${{ needs.version.outputs.short }}/g" -e "s/__BUILD__/${{ needs.version.outputs.bundle }}/g" \
            ILSight/Info.plist.in > "$app/Contents/Info.plist"
          echo "PACK_DIR=$app" >> "$GITHUB_ENV"

      # Each RID is its own channel: both Macs would otherwise share the channel "osx", and each one's
      # update feed would overwrite the other's.
      - name: Pack
        run: |
          .tools/vpk --skip-updates -x pack \
            --packId ILSight --packTitle ILSight --packAuthors builtbyzee --packVersion "$VERSION" \
            --packDir "$PACK_DIR" --mainExe ${{ matrix.exe }} --icon ${{ matrix.icon }} \
            --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --outputDir releases ${{ matrix.pack_args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ILSight-${{ env.VERSION }}-${{ matrix.rid }}
          path: releases
          # What's in it is compressed already.
          compression-level: 0
          if-no-files-found: error

  # One job publishes everything, so that the platforms never race to create the release. Not with
  # `vpk upload github`: it publishes a draft, and GitHub then tries to create the tag that started this
  # run, which fails with 422 already_exists. `vpk pack` wrote each channel's feed, so uploading its
  # files is all an installed app needs.
  publish:
    if: inputs.release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ILSight-*
          path: releases
          merge-multiple: true

      # Creating the release makes its tag on the commit that was built. A tag taken meanwhile fails it,
      # rather than replacing a release that installs already have.
      - name: Publish the release
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ILSight ${TAG#v}" --generate-notes
          # assets.*.json is vpk's own build record, which no feed refers to.
          mapfile -t files < <(find releases -type f ! -name 'assets.*.json')
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
